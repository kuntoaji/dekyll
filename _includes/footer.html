<footer class="site-footer">
  <section class="wrapper">
    <p class="site-footer__colophon">
      <span>{{ site.title }}{% if site.posts.size > 0 %} / since {{ site.posts.last.date | date: "%Y" }}{% endif %}</span>
    </p>
    <ul class="footer-links">
      <li>
        <a href="{{ "/categories.html" | prepend: site.baseurl }}">Categories</a>
      </li>
      <li>
        <a href="{{ "/tags.html" | prepend: site.baseurl }}">Tags</a>
      </li>
      <li>
        <a href="{{ "/feed.xml" | prepend: site.baseurl }}">RSS</a>
      </li>
      <li>
        <a href="https://github.com/kuntoaji/dekyll" target="_blank" rel="noopener">Dekyll theme</a>
      </li>
    </ul>
  </section>
</footer>
