<header class="site-header">

  <div class="wrapper">

    <a class="site-title" href="{{ site.baseurl }}/">{{ site.title }}</a>

    <nav class="site-nav" aria-label="Main">
      {% for my_page in site.pages %}
        {% if my_page.show_in_nav %}
          <a class="page-link" href="{{ my_page.url | prepend: site.baseurl }}">{{ my_page.title }}</a>
        {% endif %}
      {% endfor %}
    </nav>

    <button type="button" class="theme-toggle" aria-label="Dark theme" aria-pressed="false">
      <svg class="theme-toggle-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg class="theme-toggle-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="5"/>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
    </button>

  </div>

  <script>
    (function () {
      var root = document.documentElement;
      var button = document.querySelector(".theme-toggle");

      function sync() {
        button.setAttribute("aria-pressed", String(root.getAttribute("data-theme") === "dark"));
      }

      button.addEventListener("click", function () {
        var theme = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", theme);
        try {
          localStorage.setItem("theme", theme);
        } catch (e) {}
        sync();
      });

      sync();
    })();
  </script>

</header>
