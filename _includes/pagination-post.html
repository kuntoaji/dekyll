<nav class="entry-nav" aria-label="Entries">
  {% if page.next.url %}
    <a href="{{ page.next.url | prepend: site.baseurl }}" class="entry-nav__link" rel="next">
      <span class="label">Newer / No. {% include entry-number.html post=page.next %}</span>
      <span class="entry-nav__title">{{ page.next.title }}</span>
    </a>
  {% endif %}
  {% if page.previous.url %}
    <a href="{{ page.previous.url | prepend: site.baseurl }}" class="entry-nav__link entry-nav__link--older" rel="prev">
      <span class="label">Older / No. {% include entry-number.html post=page.previous %}</span>
      <span class="entry-nav__title">{{ page.previous.title }}</span>
    </a>
  {% endif %}
</nav>
