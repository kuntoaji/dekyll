---
layout: default
---
<article class="post entry">

  <aside class="entry__rail">
    <p class="entry__number">Page</p>
    {% if page.last_modified_at %}
      <dl class="entry__facts">
        <div>
          <dt>Updated</dt>
          <dd><time datetime="{{ page.last_modified_at | date_to_xmlschema }}">{{ page.last_modified_at | date: "%b %-d, %Y" }}</time></dd>
        </div>
      </dl>
    {% endif %}
  </aside>

  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

</article>
